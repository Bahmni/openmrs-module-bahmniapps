<div class="login">
    <header class="reg-header">
        <div class="left">{{'LOGIN_LABEL_SSO_SIGNING_IN_KEY' | translate}}</div>
    </header>
    <div class="login-body">
        <div class="note-container">
            <div class="note error" ng-show="errorMessageTranslateKey">
                <div class="text">
                    {{errorMessageTranslateKey | translate}}
                </div>
            </div>
        </div>
        <div class="form-footer" ng-show="errorMessageTranslateKey">
            <button type="button" id="sso-end-session" class="confirm" ng-click="endSsoSession()">{{'LOGIN_LABEL_LOGIN_KEY' | translate}}</button>
        </div>
    </div>
</div>
